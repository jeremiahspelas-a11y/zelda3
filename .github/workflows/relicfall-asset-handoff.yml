name: Relicfall knight asset handoff
on:
  push:
    branches: [relicfall-asset-transfer-20261025]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate original knight GLB
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/kikoncuo/jevfire/main/web/public/assets/knight.glb -o knight.glb
          python3 - <<'PY'
          import struct,os
          b=open('knight.glb','rb').read()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2
          assert struct.unpack_from('<I',b,8)[0]==len(b)
          print('Verified GLB',len(b),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: relicfall-knight-glb
          path: knight.glb
          retention-days: 1
