name: Build Zelda3 native sandbox (code only)

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source and pinned upstream history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject ROMs, extracted assets and personal saves
        run: python3 scripts/check_no_game_assets.py
      - name: Install native compiler and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev python3
      - name: Test installer against real upstream source
        run: python3 test_install.py
      - name: Check and apply native sandbox patch
        run: |
          python3 install.py . --dry-run
          python3 install.py .
      - name: Compile game engine without ROM or extracted assets
        run: make zelda3 -j2
      - name: Run native host behavior tests without game data
        run: make -f sandbox.mk test-native-sandbox
      - name: Verify executable and dependencies
        run: |
          test -x zelda3
          file zelda3
          ldd zelda3 | tee dependencies.txt
          if grep -q 'not found' dependencies.txt; then exit 1; fi
      - name: Package only the executable, config, license and instructions
        run: |
          mkdir -p dist
          cp zelda3 zelda3.ini LICENSE.txt BUILDING_SANDBOX.md dist/
      - name: Upload Linux build (game data must be supplied locally)
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-native-practice-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7
